[package]
name = "sih-engine"
version = "0.9.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
regex = "1"
serde_yaml = "0.9"

rmcp = { version = "0.5", features = ["server", "transport-io", "transport-streamable-http-server", "transport-worker", "macros"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time"] }
async-trait = "0.1"
anyhow = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
