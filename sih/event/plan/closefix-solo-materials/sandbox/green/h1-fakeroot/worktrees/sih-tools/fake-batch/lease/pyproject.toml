[project]
name = "lease"
version = "1.26.0"
description = "租约/lease：按任务包生命周期治理写入即立约开工建副本签发会话档、租内双锁、期满归还归并拆本"
readme = "CONTRACT.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
lease = "lease.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lease"]

[dependency-groups]
dev = ["pytest>=8"]
