# ===== docmath-b3-solo 逐条挂锚（2026-09-04，只加注记零判变：谓词与参数与退出码语义零变化） =====
# 挂锚形承 gatecap 先例；判定性四候选与纯约定八件逐条注记见各规则 id 行后，推导档
# sih-math/docs/docmath-coverage-2026-09-04/docmath-anchors-derivation-2026-09-04.md。
[[rules]]
id = "C001"
# [docmath-b3-solo 挂锚] C001 纯约定 归依:env-params（标点风格，判定性扰动缺席）
kind = "charset_forbid"
params = { strings = ["——"] }
message = "禁止破折号「——」,中文连接请使用全角冒号「:」"

[[rules]]
id = "C002"
# [docmath-b3-solo 挂锚] C002 纯约定 归依:env-params（字符面风格，判定性扰动缺席）
kind = "charset_allow"
params = { ranges = ["0020-007E", "00A0-00FF", "4E00-9FFF", "3000-303F", "FF00-FFEF"] }
message = "字符 U+{char} 超出允许的 ASCII+CJK 字符集,疑似 Emoji 或装饰符号"

[[rules]]
id = "C006"
# [docmath-b3-solo 挂锚] C006 纯约定 归依:env-params（标点与括号内容风格，判定性扰动缺席）
kind = "forbid_pattern"
params = { pattern = '（(?!(?:[A-Za-z0-9 ./&+=,-]*|[A-Za-z][A-Za-z0-9 ./&+-]*，以下简写为：[A-Za-z0-9]+)）)[^）]*）' }
message = "全角括号内容非法:仅允许英文 slug、缩写引入或单一治理编号。论证/举例/补充应改为独立句或顿号串"

[[rules]]
id = "S002"
# [docmath-b3-solo 挂锚] S002 判定性 载体:ALG-012(mapping.md:212)（标题树根唯一即解析确定） 推导档:sih-math/docs/docmath-coverage-2026-09-04/docmath-anchors-derivation-2026-09-04.md
kind = "header_structure"
params = { check = "single_h1" }
message = "全文仅允许一个一级标题"

[[rules]]
id = "S004"
# [docmath-b3-solo 挂锚] S004 判定性 载体:ALG-012(mapping.md:212),ORD-008(mapping.md:184)（锚点是引用稳定端点） 推导档:sih-math/docs/docmath-coverage-2026-09-04/docmath-anchors-derivation-2026-09-04.md
kind = "header_structure"
params = { check = "anchor_required", min_level = 2 }
message = "第 {level} 级标题必须显式声明 {{#锚点}}"

[[rules]]
id = "S005"
# [docmath-b3-solo 挂锚] S005 纯约定 归依:env-params（节序观感，判定性扰动缺席）
kind = "header_structure"
params = { check = "first_h2_name", name = "概览" }
message = "全文第一个二级标题必须为「概览」(现为「{title}」)"

[[rules]]
id = "S006"
# [docmath-b3-solo 挂锚] S006 判定性 载体:ALG-012(mapping.md:212)（层级不跳即父子派生全且唯一） 推导档:sih-math/docs/docmath-coverage-2026-09-04/docmath-anchors-derivation-2026-09-04.md
kind = "header_structure"
params = { check = "no_level_skip" }
message = "标题层级跳级:上一级为 {prev} 级,当前为 {level} 级"

[[rules]]
id = "F000"
# [docmath-b3-solo 挂锚] F000 纯约定 归依:env-params（围栏语言范围，判定性扰动缺席）
kind = "line_flag"
params = { flag = "fence_open", allow_langs = ["mermaid", "filetree"] }
message = "业务文档禁止使用标记语言围栏代码块,仅允许 mermaid / filetree"

[[rules]]
id = "F002"
# [docmath-b3-solo 挂锚] F002 纯约定 归依:env-params（排版元素禁用，判定性扰动缺席）
kind = "line_flag"
params = { flag = "blockquote" }
message = "禁止块引用「>」"

[[rules]]
id = "F003"
# [docmath-b3-solo 挂锚] F003 纯约定 归依:env-params（排版元素禁用，判定性扰动缺席）
kind = "line_flag"
params = { flag = "bold" }
message = "禁止粗体「**」"

[[rules]]
id = "F005"
# [docmath-b3-solo 挂锚] F005 纯约定 归依:env-params（排版元素禁用，判定性扰动缺席）
kind = "line_flag"
params = { flag = "table" }
message = "禁止表格"

[[rules]]
id = "N002"
# [docmath-b3-solo 挂锚] N002 判定性 载体:ALG-012(mapping.md:212),ORD-008(mapping.md:184)（导航项行文法与锚点引用端点） 推导档:sih-math/docs/docmath-coverage-2026-09-04/docmath-anchors-derivation-2026-09-04.md
kind = "nav_format"
params = { }
message = "导航项格式必须为「章节简述::[链接文本](#锚点)」"

# ===== 判定性常数裸奔（gatecap-solo 批 2026-09-04 增，纯数据入包零改判定引擎） =====
# 承 mathpipe-full-program-v1 收尾批节「闸门自维持」：域内文档声明判定性常数（阈值、判据、
# 裁决规则形）而无载体引用与推导档指针即违规。合规形即声明行内携 @ 指针记号，@ 后接
# 数学载体路径（sih-math/ 条目）与推导档路径（sih-math/docs/）各一。
# C007 裸奔：声明形行全行无 @ 指针记号即违规；C008 推导档缺：仅携单指针（有载体缺推导档）即违规。
# 机械边界如实声明：行级纯数据谓词，全文档级条件与「邻近登记面」核查超出六类 text 谓词
# 能力（承 des-001-mathe 包头注记先例），由 tally R8 推导档机械复核与人工抽检承载。
# 载体：ORD-008 引用图可达与孤悬判定（mapping.md:184「引用是否可达无孤悬」）。
# 推导档：sih-math/docs/gatecap-derivation-2026-09-04.md

[[rules]]
id = "C007"
kind = "forbid_pattern"
params = { pattern = '(阈值|判据|裁决规则)\s*[0-9][^@]*$' }
message = "判定性常数裸奔:声明形行须行内携带载体引用与推导档指针(@ 记号后接 sih-math/ 路径)"

[[rules]]
id = "C008"
kind = "forbid_pattern"
params = { pattern = '(阈值|判据|裁决规则)\s*[0-9][^@]*@[^@]*$' }
message = "推导档指针缺失:声明形行仅携单指针,须载体与推导档双指针(@ 载体路径 @ 推导档路径)"

# ===== 判定性常数邻近级地板（gatemath-solo 批 2026-09-04 增，引擎谓词类扩展 doc_constant_gate） =====
# 承 mathpipe-full-program-v1 收尾批节与 SPEC-019（sih-engine/doc/spec/）：C007 行级闸之上加文档级地板，
# 触发面扩至水平与窗口与预算类，合规形即载体引用（概念 ID）与推导档指针同文档邻近在场，缺一即每条
# 声明形行各一笔。围栏内行豁免声明判定，邻近在场扫描含全文。词面族：载体承 des-001-mathe M008 前缀族
# 加 APP 附录族，推导档承 sih-math/docs/derivation 命名族。机械边界如实声明：散文后置形与节级邻近
# 不可及（SPEC-019 机械边界节），归 tally R8 与人工抽检承载。载体：ORD-008 引用图可达与孤悬判定
# （mapping.md:184「引用是否可达无孤悬」）。判变只向前生效不溯往，C007 与 C008 判定位零触碰。
# [docmath-b3-solo 补实指] C009 推导档实指：sih-math/docs/gatecap-derivation-2026-09-04.md 与 sih-engine/doc/spec/SPEC-019-constant-nearby-floor.md（命名族声明自本批落实指，规则参数零触碰）

[[rules]]
id = "C009"
kind = "doc_constant_gate"
params = { declaration = '(阈值|判据|裁决规则|水平|窗口|预算)\s*[=＝为：:]?\s*[0-9]', carrier = '\b(TOP|PROB|ORD|ALG|CALC|LIM|DIFF|INT|APP)-[0-9]+\b', derivation = 'sih-math/docs/[^ \t`)）】，。]*derivation[^ \t`)）】，。]*' }
message = "判定性常数裸奔邻近级:文档声明判定性常数而载体引用(概念 ID)与推导档指针未同文档邻近在场,缺一即违规"
